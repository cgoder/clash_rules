# ① 订阅锚点
Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.g.cn/generate_204', interval: 300}, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|测试|备用|故障|维护|公告|教程|福利|临时|使用教程|线路)).*$"}

# ② 出站锚点
# Anchor_PG: 代理优先组（不包含 DIRECT/REJECT，防止误直连）
