# =========================
# 配置文件管理
# =========================
profile:
  store-selected: true
  store-fake-ip: false

# =========================
# 域名/流量嗅探
# =========================
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS: { ports: [443, 8443] }
    HTTP: { ports: [80, 8080-8880], override-destination: true }

