# =========================
# 订阅链接（填入后自动拉取节点）
# =========================
# 把 url 替换成你的 Clash 订阅链接，不用的订阅保持不变即可
proxy-providers:
  订阅1:
    {
      type: http,
      url: 'CLASH_URL',
      path: ./providers/sub1.yaml,
      interval: 3600,
      health-check:
        {
          enable: true,
          url: 'https://www.gstatic.com/generate_204',
          interval: 300,
          lazy: true
        }
    }

# =========================
# 代理组配置
# =========================
# - include-all-proxies: true  包含手动节点
# - use: [订阅1, 订阅2, 订阅3, 订阅4, 订阅5] 包含订阅节点
# - domain-strategy: ipv4-only 强制仅使用 IPv4
# =========================
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选]
    include-all-proxies: true
    use: [订阅1]
  - name: 💬 AI 服务
    type: select
    proxies: [DIRECT, REJECT, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 📹 油管视频
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🔍 谷歌服务
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🏠 私有网络
    type: select
    proxies: [DIRECT, REJECT]
  - name: 🔒 国内服务
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选]
  - name: 📲 电报消息
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🎵 Spotify
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🐱 Github
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: Ⓜ️ 微软服务
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🍏 苹果服务
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🌐 社交媒体
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🎬 流媒体
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🎮 游戏平台
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 📚 教育资源
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: ☁️ 云服务
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 💰 金融服务
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🌐 非中国
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [DIRECT, REJECT, 香港优选, 亚洲优选, 北美优选, 欧洲优选, 🚀 节点选择]
  - name: 🛑 广告拦截
    type: select
    proxies: [DIRECT, REJECT]
  - name: 香港优选
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [订阅1]
    filter: "(?i)(港|HK|Hong)"

  - name: 亚洲优选
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [订阅1]
    filter: "(?i)(JP|Japan|日|SG|Singapore|狮|坡|TW|Taiwan|台|Korea|韩|印)"

  - name: 北美优选
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [订阅1]
    filter: "(?i)(美国|US|States|United|America|加拿大|Canada)"

  - name: 欧洲优选
    type: select
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use: [订阅1]
    filter: "(?i)(UK|英|意|FR|法|ES|西班牙|IT|意大利|RU|俄|DE|德|土耳其|荷兰)"

# =========================
# 端口监听配置（可选）
# =========================
# listeners:
#   - {name: mixed0, type: mixed, port: 42000, proxy: 日本谷歌云}
#   - {name: mixed1, type: mixed, port: 42001, proxy: 美国家宽}

# =========================
# 基础配置
# =========================
mixed-port: 7897
allow-lan: true
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

# =========================
