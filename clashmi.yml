# ============================================================
# clashmi.yml — 与 clash.js 逻辑对齐的静态配置
#
# ⚠️ 本文件由 clash.js 的常量派生，请勿单独修改路由逻辑；
#    两边的组名、规则顺序、规则集命名、健康检查参数必须保持一致。
#    一致性由 scripts/check_config_sync.mjs 校验。
#
# 与 clash.js 的唯一固有差异（静态 YAML 的能力边界）：
#   1. 节点由客户端注入，本文件不含任何订阅链接或节点凭据。
#   2. clash.js 会把与内置名（DIRECT/REJECT 等）冲突的节点自动改名；
#      静态 YAML 做不到，订阅里若出现这类节点名，内核会报 duplicate name。
# ============================================================

# ---------- 基础设置（standalone 必需，clash.js 默认交由客户端控制）----------
mixed-port: 7893
mode: rule
allow-lan: true
bind-address: "*"
tcp-concurrent: true
unified-delay: true   # 与 clash.js 的 ENSURE_UNIFIED_DELAY 对齐：剥离 https 测速握手开销
log-level: warning
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true

# 管理面板
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: ""
external-ui-url: https://v4.gh-proxy.org/https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip

# TUN（SideStore / LiveContainer 免电脑续签依赖，勿删）
tun:
  enable: true
  stack: gvisor
  mtu: 1300
  dns-hijack: ['any:53', 'tcp://any:53']
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false
  endpoint-independent-nat: true
  route-exclude-address:      # 注意：键名是 route-exclude-address，不是 route-exclude-cidr
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 100.64.0.0/10
    - 169.254.0.0/16
    - fc00::/7
    - fe80::/10
    # 10.0.0.0/8 与 10.7.0.0/24 必须排除在列表外，否则 10.7.0.1 会被移出 TUN，续签失效
  loopback-address:
    - 10.7.0.1

# 嗅探
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    QUIC: {ports: [443, 8443]}
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.googlevideo.com"
    - "+.youtube.com"
    - "+.telegram.org"
    - "+.t.me"
    - "+.twitter.com"
    - "+.twimg.com"
    - "+.tiktok.com"
    - "+.amazonaws.com"
  skip-domain:
    - "+.apple.com"
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"

# DNS：保留 standalone 的防污染方案，nameserver-policy 指向与 clash.js 同名的组
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  cache: {enable: true, size: 4096, expired: 3600}
  enhanced-mode: fake-ip
  prefer-h3: false
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - 'rule-set:private_domain'
    - 'rule-set:fakeip_filter'
    - '+.orb.local'
    - 'localhost'
    - '*.home.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.ntp.org'
    - '+.pool.ntp.org'
    - 'captive.apple.com'
    - 'connectivitycheck.gstatic.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'stun.*.*'
    - '+.stun.playstation.net'
    - '+.xboxlive.com'
    - '+.speedtest.net'
  use-hosts: false
  use-system-hosts: false
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
    - 223.5.5.5
    - 119.29.29.29
    - system
  nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  nameserver-policy:
    "rule-set:geolocation_not_cn": &proxy_dns
      - "https://1.1.1.1/dns-query#默认代理"
      - "https://8.8.8.8/dns-query#默认代理"
    "rule-set:my_proxy": *proxy_dns
    "+.orb.local": system

# ============================================================
# 代理（仅脚本注入的直连代理；真实节点由客户端注入）
# ============================================================
proxies:
  - {name: 'DIRECT | 仅IPv4', type: direct, ip-version: ipv4}

# ============================================================
# 策略组（组名与结构与 clash.js buildProxyGroups 一一对应）
# ============================================================
proxy-groups:
  # ---- 顶层全局入口（clash.js 会显式定义 GLOBAL 并指定默认出口）----
  - name: GLOBAL
    type: select
    proxies: [默认代理, 国内直连, 手动选择, 香港-自动选择, 香港, 日本-自动选择, 日本, 美国-自动选择, 美国, 其他节点, AI, YouTube, Google, OneDrive, GitHub, Microsoft, Apple, 漏网之鱼, 兜底自动选择]
    url: 'https://www.gstatic.com/generate_204'
    timeout: 5000
    empty-fallback: 'REJECT'
    icon: 'https://v4.gh-proxy.org/https://raw.githubusercontent.com/cgoder/clash_rules/main/icons/Rocket.png'
    default-selected: 默认代理

  # ---- 核心三大组 ----
  - name: 国内直连
    type: select
    proxies: ['DIRECT | 仅IPv4']
    url: 'https://www.gstatic.com/generate_204'
    timeout: 5000
    empty-fallback: 'REJECT'
    hidden: true
    icon: 'https://v4.gh-proxy.org/https://raw.githubusercontent.com/cgoder/clash_rules/main/icons/China.png'

  - name: 手动选择
    type: select
    proxies: [香港, 日本, 台湾, 新加坡, 美国, 韩国, 英国, 德国, 法国, 澳大利亚, 其他节点]
    url: 'https://www.gstatic.com/generate_204'
    timeout: 5000
    empty-fallback: 'REJECT'
    icon: 'https://v4.gh-proxy.org/https://raw.githubusercontent.com/cgoder/clash_rules/main/icons/Rocket.png'

  - name: 默认代理
    type: select
    proxies: [香港, 日本, 台湾, 新加坡, 美国, 韩国, 英国, 德国, 法国, 澳大利亚, 其他节点, 兜底自动选择]
    url: 'https://www.gstatic.com/generate_204'
    timeout: 5000
    empty-fallback: 'REJECT'
    icon: 'https://v4.gh-proxy.org/https://raw.githubusercontent.com/cgoder/clash_rules/main/icons/Rocket.png'

  # ---- 地区组（url-test 区内测速，exclude-type 排除 direct 代理）----
  - name: 香港-自动选择
    type: url-test
    tolerance: 150
    interval: 300
    timeout: 5000
    url: 'https://www.gstatic.com/generate_204'
    lazy: true
    max-failed-times: 3
    empty-fallback: REJECT
    exclude-type: DIRECT
    include-all: true
    filter: '^(?i)(?!(?:🇯🇵|🇹🇼|🇸🇬|🇺🇸|🇰🇷|🇬🇧|🇩🇪|🇫🇷|🇦🇺))(?=.*(香港|🇭🇰|(?<![A-Za-z])(?:HK|HKG)(?![A-Za-z])|hong\s*kong)).*$'
    hidden: true
    icon: 'https://v4.gh-proxy.org/https://raw.githubusercontent.com/cgoder/clash_rules/main/icons/HK.png'

  - name: 香港
    type: select
    proxies: [香港-自动选择, 兜底自动选择]
