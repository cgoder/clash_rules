    <<: *Anchor_LB
    filter: *Anchor_TW
    include-all: true
    icon: 'https://v4.gh-proxy.org/https://github.com/cgoder/clash_rules/raw/main/icons/TW.png'
  - name: 台湾速度优先
    <<: *Anchor_UT
    filter: *Anchor_TW
    include-all: true
    icon: 'https://v4.gh-proxy.org/https://github.com/cgoder/clash_rules/raw/main/icons/TW.png'

  # 新加坡组
  - name: 新加坡负载均衡
