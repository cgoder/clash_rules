    filter: '^(?i)(?!(?:🇯🇵|🇹🇼|🇸🇬|🇺🇸|🇰🇷|🇬🇧|🇩🇪|🇫🇷|🇦🇺))(?=.*(香港|🇭🇰|(?<![A-Za-z])(?:HK|HKG)(?![A-Za-z])|hong\s*kong)).*$'
