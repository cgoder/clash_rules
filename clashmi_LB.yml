  - name: 其他负载均衡
    <<: *Anchor_LB
    filter: *Anchor_OT
    include-all: true
    icon: 'https://v4.gh-proxy.org/https://github.com/cgoder/clash_rules/raw/main/icons/OT.png'

  # === 备用最快节点组 ===
