  # === 区域负载均衡组（核心）===
  # 香港负载均衡（13个节点）
  - name: 香港负载均衡
    <<: *Anchor_LB
    filter: *Anchor_HK
    include-all: true
    icon: 'https://v4.gh-proxy.org/https://github.com/cgoder/clash_rules/raw/main/icons/HK.png'

  # 台湾负载均衡（8个节点）
