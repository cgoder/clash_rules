    <<: *Anchor_UT
    filter: *Anchor_HK
    include-all: true
    icon: 'https://v4.gh-proxy.org/https://github.com/cgoder/clash_rules/raw/main/icons/HK.png'

  - name: 台湾最快
    <<: *Anchor_UT
    filter: *Anchor_TW
    include-all: true
    icon: 'https://v4.gh-proxy.org/https://github.com/cgoder/clash_rules/raw/main/icons/TW.png'

  - name: 美国最快
    <<: *Anchor_UT
    filter: *Anchor_US
    include-all: true
    icon: 'https://v4.gh-proxy.org/https://github.com/cgoder/clash_rules/raw/main/icons/US.png'

