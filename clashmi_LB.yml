    <<: *Anchor_LB
    filter: *Anchor_SG
    include-all: true
    icon: 'https://v4.gh-proxy.org/https://github.com/cgoder/clash_rules/raw/main/icons/SG.png'

  # 日本负载均衡（1个节点）
